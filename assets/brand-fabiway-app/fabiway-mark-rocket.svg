<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="FabiWay (rocket)">
<title>FabiWay (rocket)</title>
<defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#005C48"/><stop offset=".2" stop-color="#005B46"/><stop offset=".45" stop-color="#0E756D"/><stop offset=".65" stop-color="#14B8A6"/><stop offset=".75" stop-color="#425943"/><stop offset=".82" stop-color="#6E513B"/><stop offset=".88" stop-color="#924227"/><stop offset=".93" stop-color="#B02813"/><stop offset=".97" stop-color="#C20000"/><stop offset="1" stop-color="#DD0000"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#0a1418"/><stop offset="1" stop-color="#05080a"/></radialGradient>
<linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset=".5" stop-color="#CBD5E1"/><stop offset="1" stop-color="#475569"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset=".35" stop-color="#1E3A4C"/><stop offset="1" stop-color="#0B1E2A"/></linearGradient>
<linearGradient id="beamg" gradientUnits="userSpaceOnUse" x1="222" y1="0" x2="580" y2="0"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".75"/><stop offset=".45" stop-color="#FFF3C4" stop-opacity=".28"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></linearGradient>
<linearGradient id="beamv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".85"/><stop offset=".6" stop-color="#FFF3C4" stop-opacity=".25"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".55"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
<linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".5" stop-color="#FFB020"/><stop offset="1" stop-color="#FF2500" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
<style>
@keyframes lit{0%,8%{opacity:0}28%,72%{opacity:1}92%,100%{opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-300px)}70%,100%{transform:translateX(700px)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes lunge{0%,100%{transform:translateX(0)}30%,72%{transform:translateX(5px)}}
@keyframes tilt{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-6deg)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes flicker{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
.lit{animation:lit 6s ease-in-out infinite}
.sway{transform-origin:222px 66px;animation:sway 3s ease-in-out infinite}
.l1{animation:blink 1.2s ease-in-out infinite}
.l2{animation:blink 1.2s ease-in-out .3s infinite}
.l3{animation:blink 1.2s ease-in-out .6s infinite}
.l4{animation:blink 1.2s ease-in-out .9s infinite}
.sw{transform:translateX(-300px);animation:sweep 6s ease-in-out infinite}
.hov{animation:hover 2.4s ease-in-out infinite}
.lunge{animation:lunge 6s ease-in-out infinite}
.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}
.tw1{animation:twinkle 2.6s ease-in-out infinite}
.tw2{animation:twinkle 2.6s ease-in-out .9s infinite}
.tw3{animation:twinkle 2.6s ease-in-out 1.7s infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:top center;animation:flicker .35s ease-in-out infinite}
</style>
</defs>

<rect width="160" height="160" rx="22" fill="url(#bg)"/>
<circle class="tw1" cx="24" cy="30" r="1.6" fill="#fff"/><circle class="tw2" cx="136" cy="24" r="1.4" fill="#fff"/>
<circle class="tw3" cx="20" cy="116" r="1.3" fill="#fff"/><circle class="tw1" cx="140" cy="108" r="1.6" fill="#fff"/>
<circle class="tw2" cx="122" cy="62" r="1.1" fill="#fff"/><circle class="tw3" cx="38" cy="70" r="1.2" fill="#fff"/>
<g class="lit"><ellipse cx="80" cy="84" rx="50" ry="62" fill="url(#halo)"/></g>
<g class="hov"><g transform="rotate(35 80 80)">
  <path d="M80 18Q102 44 102 86H58Q58 44 80 18Z" fill="url(#hull)"/>
  <path d="M58 70L40 100L58 94Z" fill="#14B8A6"/><path d="M102 70L120 100L102 94Z" fill="#14B8A6"/>
  <path d="M72 86H88V98Q80 104 72 98Z" fill="#0E756D"/>
  <circle cx="80" cy="56" r="10" fill="url(#glass)" stroke="#14B8A6" stroke-width="2.4"/>
  <path d="M75 52Q77 48 82 48" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="58" y="80" width="44" height="4" fill="#FF2500"/>
  <g class="fl"><path d="M72 100Q80 132 88 100Z" fill="url(#flame)"/></g>
</g></g>
<path d="M44 154H116" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
</svg>
