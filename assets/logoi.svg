<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="150" viewBox="0 0 1040 150" role="img" aria-label="Transit Desert Mapper">
<title>Transit Desert Mapper</title>
<defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#005C48"/><stop offset=".2" stop-color="#005B46"/><stop offset=".45" stop-color="#0E756D"/><stop offset=".65" stop-color="#14B8A6"/><stop offset=".75" stop-color="#425943"/><stop offset=".82" stop-color="#6E513B"/><stop offset=".88" stop-color="#924227"/><stop offset=".93" stop-color="#B02813"/><stop offset=".97" stop-color="#C20000"/><stop offset="1" stop-color="#DD0000"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#0a1418"/><stop offset="1" stop-color="#05080a"/></radialGradient>
<linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset=".55" stop-color="#CBD5E1"/><stop offset="1" stop-color="#64748B"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset=".35" stop-color="#1E3A4C"/><stop offset="1" stop-color="#0B1E2A"/></linearGradient>
<linearGradient id="beamg" gradientUnits="userSpaceOnUse" x1="217" y1="0" x2="723" y2="0"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".75"/><stop offset=".45" stop-color="#FFF3C4" stop-opacity=".28"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".55"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="txt"><text x="240.0" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="214.7" lengthAdjust="spacingAndGlyphs">Transit</text><text x="472.5" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="192.4" lengthAdjust="spacingAndGlyphs">Desert</text><text x="682.8" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="237.2" lengthAdjust="spacingAndGlyphs">Mapper</text></clipPath>
<style>
@keyframes lit{0%,8%{opacity:0}28%,72%{opacity:1}92%,100%{opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes flick{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-240px)}70%,100%{transform:translateX(1080px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
@keyframes lunge{0%,100%{transform:translateX(0)}30%,72%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lit{animation:lit 6s ease-in-out infinite}
.sway{transform-origin:216.9px 73.7px;animation:sway 3s ease-in-out infinite}
.hl{animation:flick .5s ease-in-out infinite}
.sw{animation:sweep 6s ease-in-out infinite}
.bob{animation:bob .55s ease-in-out infinite}
.lunge{animation:lunge 6s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
</style>
</defs>
<rect width="1040" height="150" rx="14" fill="url(#bg)"/>

<g class="lit"><ellipse cx="569" cy="68" rx="144" ry="46" fill="url(#halo)"/></g>
<g class="lit"><g class="sway"><path d="M216.9 73.7 L723 36 L723 112 Z" fill="url(#beamg)"/></g></g>

<text fill="#FFFFFF" x="240.0" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="214.7" lengthAdjust="spacingAndGlyphs" >Transit</text>
<text fill="#5E7378" x="472.5" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="192.4" lengthAdjust="spacingAndGlyphs" >Desert</text>
<g class="lit"><text fill="#FFE9A8" x="472.5" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="192.4" lengthAdjust="spacingAndGlyphs" filter="url(#blur)" opacity=".9">Desert</text><text fill="#FFFFFF" x="472.5" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="192.4" lengthAdjust="spacingAndGlyphs" >Desert</text></g>
<text x="682.8" y="92" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="237.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#0B6B5F">M</tspan><tspan fill="#0E756D">a</tspan><tspan fill="#10857B">p</tspan><tspan fill="#12998B">p</tspan><tspan fill="#14B8A6">e</tspan><tspan fill="#12998B">r</tspan></text>
<g clip-path="url(#txt)"><rect class="sw" x="0" y="30" width="200" height="80" fill="url(#sheen)" transform="skewX(-18)"/></g>

<g transform="translate(126 44) scale(.9)"><g class="lunge"><ellipse cx="52" cy="53" rx="48" ry="3" fill="#000" opacity=".55" />
    <g class="bob">
        <path d="M6 7Q6 0 13 0H84Q96 0 100 12L103 34Q103 44 95 44H10Q4 44 4 38Z" fill="url(#busBody)" />
    <path d="M4 31H103V38Q103 44 95 44H10Q4 44 4 38Z" fill="#0F172A" opacity=".16" />
    
    <path d="M5 28H102" stroke="#14B8A6" stroke-width="3.2" />
    <rect x="12" y="7" width="15" height="14" rx="3" fill="url(#glass)" /><rect x="30" y="7" width="15" height="14" rx="3" fill="url(#glass)" /><rect x="48" y="7" width="15" height="14" rx="3" fill="url(#glass)" />
    <rect x="67" y="6" width="6.5" height="31" rx="1.6" fill="url(#glass)" /><rect x="75" y="6" width="6.5" height="31" rx="1.6" fill="url(#glass)" />
    <path d="M85 7H88.5Q94.5 7 97.5 16L100 25H85Z" fill="url(#glass)" />
        
    <ellipse class="hl" cx="101" cy="33" rx="3" ry="2.4" fill="#FFF6C8"/>
    <rect x="3" y="29" width="3" height="7" rx="1" fill="#FF2500" />
    <g transform="translate(24 44)"><circle r="10.5" fill="#05080a" /><circle r="8" fill="#0d1417" stroke="#34D399" stroke-opacity=".35" stroke-width=".8" /><g class="wheel"><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(0)" /><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(60)" /><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(120)" /><circle r="5" fill="none" stroke="#AEE9E0" stroke-width="1.2" /></g><circle r="1.6" fill="#E3F8F5" /></g><g transform="translate(80 44)"><circle r="10.5" fill="#05080a" /><circle r="8" fill="#0d1417" stroke="#34D399" stroke-opacity=".35" stroke-width=".8" /><g class="wheel"><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(0)" /><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(60)" /><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(120)" /><circle r="5" fill="none" stroke="#AEE9E0" stroke-width="1.2" /></g><circle r="1.6" fill="#E3F8F5" /></g>
  </g>
</g></g>
<rect x="310" y="116" width="420" height="2" rx="1" fill="url(#line)"/>
</svg>