<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Transit Desert Mapper logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0E756D"/></linearGradient>
    <style>
      .ring{transform-origin:64px 64px;animation:spin 24s linear infinite}
      .core{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    </style>
  </defs>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#g)" stroke-width="6"/>
  <circle class="ring" cx="64" cy="64" r="34" fill="none" stroke="#14B8A6" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="3 6" stroke-linecap="round"/>
  <path d="M24 64H104" stroke="#E3F8F5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="64" r="4.5" fill="#050506" stroke="#E3F8F5" stroke-width="3"/><circle cx="104" cy="64" r="4.5" fill="#050506" stroke="#E3F8F5" stroke-width="3"/>
  <circle class="core" cx="64" cy="64" r="10" fill="#14B8A6" stroke="#050506" stroke-width="3"/>
  <circle cx="98" cy="30" r="4" fill="#FF2500"/>
</svg>
