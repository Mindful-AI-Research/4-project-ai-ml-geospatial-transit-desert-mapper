<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Pipeline: GTFS and Census 2022 feed the metrics, classification and ranking, a model benchmark, and the dashboard">
  <title>Transit Desert Mapper — pipeline</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0E756D"/></linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="80%"><stop offset="0" stop-color="#0E756D" stop-opacity=".30"/><stop offset="1" stop-color="#0E756D" stop-opacity="0"/></radialGradient>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;fill:#E3F8F5;font-size:15px;font-weight:600}
      .s{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#E3F8F5;fill-opacity:.55;font-size:11.5px}
      .h{font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;fill:#14B8A6;font-size:11px;font-weight:700;letter-spacing:3px}
      .box{fill:#0b1416;stroke:url(#g);stroke-width:2}
      .link{fill:none;stroke:#14B8A6;stroke-opacity:.35;stroke-width:2}
      .flow{fill:none;stroke:#14B8A6;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 22;animation:f 2.4s linear infinite}
      .flow.r{stroke:#FF2500;animation-duration:3.2s}
      .pulse{transform-box:fill-box;transform-origin:center;animation:p 3.2s ease-in-out infinite}
      .d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}.d5{animation-delay:2s}
      @keyframes f{to{stroke-dashoffset:-56}}
      @keyframes p{0%,100%{opacity:.75}50%{opacity:1;filter:drop-shadow(0 0 8px #14B8A6)}}
    </style>
  </defs>
  <rect width="1000" height="380" rx="16" fill="#050506"/><rect width="1000" height="380" rx="16" fill="url(#glow)"/>
  <text class="h" x="32" y="40">PIPELINE · OPEN DATA → INDEX → MAP</text>

  <!-- links -->
  <path id="a" class="link" d="M222 120 C262 120 262 190 302 190"/>
  <path id="b" class="link" d="M222 260 C262 260 262 190 302 190"/>
  <path id="c" class="link" d="M462 190 H512"/>
  <path id="d" class="link" d="M672 190 H722"/>
  <path class="flow" d="M222 120 C262 120 262 190 302 190"/>
  <path class="flow" d="M222 260 C262 260 262 190 302 190" style="animation-delay:.4s"/>
  <path class="flow" d="M462 190 H512" style="animation-delay:.8s"/>
  <path class="flow" d="M672 190 H722" style="animation-delay:1.2s"/>

  <!-- nodes -->
  <g class="pulse"><rect class="box" x="32" y="90" width="190" height="60" rx="12"/><text class="t" x="48" y="116">GTFS · SPTrans</text><text class="s" x="48" y="136">stops · stop_times</text></g>
  <g class="pulse d2"><rect class="box" x="32" y="230" width="190" height="60" rx="12"/><text class="t" x="48" y="256">Census 2022 · IBGE</text><text class="s" x="48" y="276">sectors · population</text></g>
  <g class="pulse d3"><rect class="box" x="302" y="150" width="160" height="80" rx="12"/><text class="t" x="318" y="180">Metrics</text><text class="s" x="318" y="199">dist. · departures</text><text class="s" x="318" y="215">thresholds.yaml</text></g>
  <g class="pulse d4"><rect class="box" x="512" y="150" width="160" height="80" rx="12"/><text class="t" x="528" y="180">Classify + Rank</text><text class="s" x="528" y="199">desert · score</text><text class="s" x="528" y="215">Top-10</text></g>
  <g class="pulse d5"><rect class="box" x="722" y="150" width="210" height="80" rx="12"/><text class="t" x="738" y="180">Dashboard</text><text class="s" x="738" y="199">Streamlit + MapLibre</text><text class="s" x="738" y="215">PT / EN</text></g>

  <!-- ML branch -->
  <path class="link" d="M592 230 V300 H722" stroke-dasharray="3 6"/>
  <path class="flow" d="M592 230 V300 H722" style="animation-delay:1.6s"/>
  <g class="pulse d3"><rect class="box" x="722" y="270" width="210" height="60" rx="12" stroke-dasharray="6 5"/><text class="t" x="738" y="296">Benchmark (Colab)</text><text class="s" x="738" y="316">spatial CV by region</text></g>
  <path class="link" d="M827 270 V230"/>
  <path class="flow r" d="M827 270 V230"/>

  <!-- legend -->
  <circle cx="40" cy="352" r="5" fill="#14B8A6"/><text class="s" x="54" y="356">data flow</text>
  <circle cx="150" cy="352" r="5" fill="#FF2500"/><text class="s" x="164" y="356">model output (optional)</text>
  <text class="s" x="560" y="356">Analytical index from open data — not a field diagnosis.</text>
</svg>
