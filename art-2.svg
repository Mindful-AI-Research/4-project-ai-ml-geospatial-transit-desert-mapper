<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="160" viewBox="0 0 1040 160" role="img" aria-label="Transit Desert Mapper">
<title>Transit Desert Mapper</title>
<defs>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#005C48"/><stop offset=".25" stop-color="#0A7A6A"/><stop offset=".5" stop-color="#14B8A6"/><stop offset=".75" stop-color="#34D399"/><stop offset=".92" stop-color="#7FBF7F"/><stop offset="1" stop-color="#DD0000"/></linearGradient>
<linearGradient id="roadg" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#0A7A6A" stop-opacity="0"/><stop offset=".2" stop-color="#14B8A6"/><stop offset=".7" stop-color="#34D399"/><stop offset=".96" stop-color="#7FBF7F"/><stop offset="1" stop-color="#DD0000"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".4" r=".9"><stop offset="0" stop-color="#0b1416"/><stop offset="1" stop-color="#05080a"/></radialGradient>
<linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset=".55" stop-color="#CBD5E1"/><stop offset="1" stop-color="#64748B"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset=".35" stop-color="#1E3A4C"/><stop offset="1" stop-color="#0B1E2A"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6C8" stop-opacity=".75"/><stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/></linearGradient>
<clipPath id="txt"><text x="180" y="68" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="680" lengthAdjust="spacingAndGlyphs">Transit Desert Mapper</text></clipPath>
<style>
@keyframes sweep{0%{transform:translateX(-260px)}60%,100%{transform:translateX(1100px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{0%{opacity:0;transform:translateX(6px)}40%{opacity:.9}100%{opacity:0;transform:translateX(-8px)}}
@keyframes road{to{stroke-dashoffset:26}}
@keyframes drive{from{transform:translateX(-150px)}to{transform:translateX(1250px)}}
@keyframes beam{0%,100%{opacity:.45}50%{opacity:1}}
.sw{animation:sweep 5.5s ease-in-out infinite}
.bob{animation:bob 1.3s ease-in-out infinite}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}
.beam{animation:beam 2.6s ease-in-out infinite}
.road{animation:road .7s linear infinite}
.drive{animation:drive 9s cubic-bezier(.45,.05,.55,.95) infinite}
@media (prefers-reduced-motion:reduce){.sw,.bob,.wheel,.beam,.road,.drive{animation:none}.sw{opacity:0}}
</style>
</defs>
<rect width="1040" height="160" rx="14" fill="url(#bg)"/>
<line class="road" x1="40" y1="148" x2="1000" y2="148" stroke="url(#roadg)" stroke-width="1.8" stroke-dasharray="14 12" stroke-linecap="round"/>
<g transform="translate(0 96) scale(.9)"><g class="drive">
  <ellipse cx="52" cy="53" rx="48" ry="3" fill="#000" opacity=".55"/>
    <g class="bob">
        <path d="M6 7Q6 0 13 0H84Q96 0 100 12L103 34Q103 44 95 44H10Q4 44 4 38Z" fill="url(#busBody)"/>
    <path d="M4 31H103V38Q103 44 95 44H10Q4 44 4 38Z" fill="#0F172A" opacity=".16"/>
    
    <path d="M5 28H102" stroke="#14B8A6" stroke-width="3.2"/>
    <rect x="12" y="7" width="15" height="14" rx="3" fill="url(#glass)"/><rect x="30" y="7" width="15" height="14" rx="3" fill="url(#glass)"/><rect x="48" y="7" width="15" height="14" rx="3" fill="url(#glass)"/>
    <rect x="67" y="6" width="6.5" height="31" rx="1.6" fill="url(#glass)"/><rect x="75" y="6" width="6.5" height="31" rx="1.6" fill="url(#glass)"/>
    <path d="M85 7H88.5Q94.5 7 97.5 16L100 25H85Z" fill="url(#glass)"/>
        <path d="M103 33L118 26V41Z" fill="url(#beam)" class="beam"/>
    <ellipse cx="101" cy="33" rx="2.8" ry="2.3" fill="#FFF6C8"/>
    <rect x="3" y="29" width="3" height="7" rx="1" fill="#FF2500"/>
    <g transform="translate(24 44)"><circle r="10.5" fill="#05080a"/><circle r="8" fill="#0d1417" stroke="#34D399" stroke-opacity=".35" stroke-width=".8"/><g class="wheel"><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(0)"/><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(60)"/><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(120)"/><circle r="5" fill="none" stroke="#AEE9E0" stroke-width="1.2"/></g><circle r="1.6" fill="#E3F8F5"/></g><g transform="translate(80 44)"><circle r="10.5" fill="#05080a"/><circle r="8" fill="#0d1417" stroke="#34D399" stroke-opacity=".35" stroke-width=".8"/><g class="wheel"><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(0)"/><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(60)"/><line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#AEE9E0" stroke-width="1.1" transform="rotate(120)"/><circle r="5" fill="none" stroke="#AEE9E0" stroke-width="1.2"/></g><circle r="1.6" fill="#E3F8F5"/></g>
  </g>
</g></g>
<text x="180" y="68" text-anchor="start" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" letter-spacing="1" textLength="680" lengthAdjust="spacingAndGlyphs"><tspan fill="#FFFFFF">Transit Desert </tspan><tspan fill="#0E8F82">M</tspan><tspan fill="#119E90">a</tspan><tspan fill="#14B8A6">p</tspan><tspan fill="#25CBB5">p</tspan><tspan fill="#2DD4BF">e</tspan><tspan fill="#34D399">r</tspan></text>
<g clip-path="url(#txt)"><rect class="sw" x="0" y="20" width="220" height="90" fill="url(#sheen)" transform="skewX(-18)"/></g>
</svg>